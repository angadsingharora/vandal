name: keepalive

# Render's free tier sleeps a service after 15 idle minutes, and the next visitor waits about a
# minute for it to wake. Pinging /health every ten minutes keeps the live demo warm.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS --max-time 90 https://vandal-api.onrender.com/health
