[project]
name = "vandal"
version = "0.1.0"
description = "Red, Blue, and the Operator: adversarial testing and runtime guarding for autonomous finance."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0",
]

[project.scripts]
vandal = "vandal.cli:main"

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "vandal"
module-root = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
