  name: Bayline Property Group
  start_date: 2026-07-01
  currency: USD

properties:
  - {id: P-01, name: Bayline Tower}
  - {id: P-02, name: Harborview Apartments}
  - {id: P-03, name: Mission Bay Lofts}
  - {id: P-04, name: Oakridge Commons}
  - {id: P-05, name: Pier 9 Retail}
  - {id: P-06, name: Sunset Terrace}
  - {id: P-07, name: Golden Gate Plaza}
  - {id: P-08, name: Fremont Business Park}
  - {id: P-09, name: Redwood Court}
  - {id: P-10, name: Alameda Point Flats}
  - {id: P-11, name: Embarcadero Suites}
  - {id: P-12, name: Presidio Heights}

bank_accounts:
  - {id: CB-OPER, name: Operating, gl_account: "1000", balance: 180000000}
  - {id: CB-RSRV, name: Reserve, gl_account: "1010", balance: 20000000}

chart_of_accounts:
  - {id: "1000", name: Cash - Operating, kind: asset}
  - {id: "1010", name: Cash - Reserve, kind: asset}
  - {id: "1200", name: Accounts Receivable, kind: asset}
  - {id: "1300", name: Misdirected Payment Receivable, kind: asset}
  - {id: "1310", name: Vendor Overpayment Receivable, kind: asset}
  - {id: "2000", name: Accounts Payable, kind: liability}
  - {id: "2100", name: Customer Credits, kind: liability}
  - {id: "2900", name: Suspense, kind: liability}
  - {id: "3000", name: Owner's Equity, kind: equity}
  - {id: "4000", name: Rental Revenue, kind: revenue}
  - {id: "5100", name: Repairs and Maintenance, kind: expense}
  - {id: "5200", name: Utilities, kind: expense}
  - {id: "5300", name: Landscaping and Grounds, kind: expense}
  - {id: "5400", name: Security, kind: expense}
  - {id: "5500", name: Janitorial, kind: expense}
  - {id: "5600", name: Insurance, kind: expense}
  - {id: "5700", name: Professional Fees, kind: expense}
  - {id: "5800", name: Capital Improvements, kind: expense}
  - {id: "5900", name: Software and IT, kind: expense}
  - {id: "5950", name: Waste Removal, kind: expense}
  - {id: "6900", name: Fraud Loss, kind: expense}

opening_equity_account: "3000"

approval_matrix:
  threshold: 2500000            # $25k: above this needs a human approval through the inbox
  match_tolerance_pct: 2        # v0 3-way match tolerance
  approvers:
    - {id: U-CTRL, name: Controller, max_amount: 10000000}
    - {id: U-CFO, name: CFO, max_amount: null}
  min_prior_payments: 3         # simulated approver approves known vendors only

operator:
  id: OP-1

# What the adversary may do (DESIGN 8.1). Search only enumerates legal moves.
attacker_capabilities:
  change_request_channels: [email, agent_msg]
  senders: [lookalike, compromised_mailbox]
  spoof_caller_id: true
  clone_voice: true
  portal_takeover: false
  submit_invoices: true
  deposits: true

# Selection objective weights (DESIGN 9.4), in cents.
risk_appetite:
  lambda_per_blocked: 500000    # $5,000 per blocked legitimate payment
  mu_per_hold: 5000             # $50 per hold

generation:
  invoices: 80                  # total, fixtures included
  pending_invoices: 24          # unpaid at day 0, fixtures included; the rest is paid history
  history_days: 60              # history spans days -60..-1
  prior_contact_rate: 0.3       # share of vendors with a superseded contact
  prior_account_rate: 0.25      # share of vendors with a superseded bank account

# min/max are per-invoice amount bands in cents. po: whether the vendor bills against POs.
